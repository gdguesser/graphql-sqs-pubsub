name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Build ESM, CommonJS, and types
        run: npm run build
      - name: Validate ESM and CommonJS exports
        run: npm run exports:check
      - name: Validate npm package contents
        run: npm run pack:check
      - name: Audit production dependencies
        run: npm run audit:prod

  localstack:
    name: LocalStack integration
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack@sha256:a65ee2a9d45a7a34a1f1faae515d2e577ce11210312c077700ccc82daefec238
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl --fail http://localhost:4566/_localstack/health"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run real-SQS integration test
        run: npm run test:integration
