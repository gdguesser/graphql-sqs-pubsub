services:
  localstack:
    image: localstack/localstack@sha256:f52869de342d4758f6899d88a561b586765ac6789e7e1484e8806e0fc0eeed88
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
