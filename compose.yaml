services:
  localstack:
    image: localstack/localstack@sha256:a65ee2a9d45a7a34a1f1faae515d2e577ce11210312c077700ccc82daefec238
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
